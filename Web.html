<!DOCTYPE html>
<html>
    <head>
        <title>Student website</title>
        <meta name="viewport" 
        content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="sty.css">
    </head>
    <body>
        <h1>Student Project</h1>
        <input type="number" id="roll" placeholder="Enter Roll No">
        <button onclick="checkRoll()">Submit</button>
        <div>
            <img id="img" src="sunset.jpeg">
        </div>
        <div>
            <video id="video" controls>
                <source src="video.mp4" type="video/mp4"></source>
            </video>
        </div>
        <button id="mainBtn">click me</button>
        <nav>
            <a href="https://spotify.com">spotify</a>
            <a href="https://amazon.com">amazon</a>
            <a href="https://google.com">google</a>
        </nav>
        <table>
            <tr>
                <th>Sports</th>
                <th>Hobby</th>
                <th>Food</th>
            </tr>
            <tr>
                <td>Cricket</td>
                <td>Painting</td>
                <td>Biryani</td>
            </tr>
            <tr>
                <td>Football</td>
                <td>Listening Music</td>
                <td>Grill</td>
            </tr>
        </table>
        
        <div class="grid">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
        <div class="box">4</div>
        <div class="box">5</div>
        <div class="box">6</div>
        <div class="box">7</div>
        <div class="box">8</div>
        

    </div>
    <script src="Roll.js"></script>

    </body>
</html>
